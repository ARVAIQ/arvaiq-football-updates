name: Publish ARVAIQ Football 2.0.7

on:
  push:
    branches:
      - main
    paths:
      - "release-assets/v2.0.7/**"
      - "RELEASE_NOTES_2.0.7.md"
      - ".github/workflows/publish-2.0.7.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate release assets
        shell: bash
        run: |
          set -euo pipefail
          test -f "release-assets/v2.0.7/ARVAIQ.Football.-.Setup.exe"
          test -f "release-assets/v2.0.7/ARVAIQFootballSetup.sha256"
          test -f "release-assets/v2.0.7/ARVAIQFootball.exe"
          test -f "release-assets/v2.0.7/ARVAIQFootball.sha256"

      - name: Verify SHA-256
        shell: bash
        working-directory: release-assets/v2.0.7
        run: |
          set -euo pipefail
          sha256sum -c ARVAIQFootballSetup.sha256
          sha256sum -c ARVAIQFootball.sha256

      - name: Create or replace v2.0.7 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view v2.0.7 >/dev/null 2>&1; then
            gh release delete v2.0.7 --cleanup-tag --yes
          fi

          gh release create v2.0.7 \
            "release-assets/v2.0.7/ARVAIQ.Football.-.Setup.exe" \
            "release-assets/v2.0.7/ARVAIQFootballSetup.sha256" \
            "release-assets/v2.0.7/ARVAIQFootball.exe" \
            "release-assets/v2.0.7/ARVAIQFootball.sha256" \
            --title "ARVAIQ Football 2.0.7" \
            --notes-file "RELEASE_NOTES_2.0.7.md" \
            --target main \
            --latest
